<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema - Librería Arcángel Gabriel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
    <div class="container" style="max-width: 420px;">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-user-shield text-primary display-4 mb-2"></i>
                    <h4 class="fw-bold">Acceso al Sistema</h4>
                    <p class="text-muted small">Ingresa tus credenciales para administrar el sistema</p>
                </div>

                <div id="authAlert" class="alert d-none" role="alert"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Correo Electrónico</label>
                        <input type="email" id="loginEmail" class="form-control" required placeholder="admin@libreria.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Contraseña</label>
                        <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold mb-3">Iniciar Sesión</button>
                </form>

                <hr>

                <div class="text-center">
                    <small class="text-muted">¿No tienes cuenta? Solicita un registro con rol de Operador o Administrador al área encargada.</small>
                    <div class="mt-3">
                        <a href="index.html" class="text-decoration-none small"><i class="fa-solid fa-arrow-left me-1"></i> Volver a la Web Principal</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const alertBox = document.getElementById('authAlert');

            try {
                const res = await fetch('https://libreria-arcangel-gabriel.onrender.com/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    window.location.href = 'dashboard.html';
                } else {
                    alertBox.className = 'alert alert-danger';
                    alertBox.textContent = data.error || 'Credenciales incorrectas';
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                alertBox.className = 'alert alert-warning';
                alertBox.textContent = 'Error de conexión con el servidor backend.';
                alertBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
